# ==============================================================
# FedPDA-IDS master configuration
#
# This file is the single source of truth for every hyperparameter
# fixed in the frozen design spec. Code should read values from here
# rather than hardcoding them, so that (a) every experiment is
# reproducible from a config + seed, and (b) changing a value is a
# one-line, reviewable diff instead of a hunt through source files.
# ==============================================================

project:
  name: "FedPDA-IDS"
  seed: 42
  seeds_for_final_runs: [42, 123, 2024]   # 3-seed mean +/- std, per spec

paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  data_external: "data/external"
  logs: "logs"
  experiments: "experiments/results"
  checkpoints: "experiments/checkpoints"

# ------------------------------------------------------------
# Data pipeline (Phase 2)
# ------------------------------------------------------------
data:
  # Chronological per-source-host split fractions. Not specified by the
  # frozen spec (which only fixes the *shape* of the split, not the
  # ratios) -- kept here, not hardcoded, so it's a one-line, reviewable
  # choice rather than buried in code.
  train_fraction: 0.70
  val_fraction: 0.15
  test_fraction: 0.15

  # Row must have this fraction of the numeric feature columns non-null
  # after coercion to be kept; below this the row is dropped as corrupt
  # rather than imputed (per-row NaN handling policy for Phase 2).
  max_row_nan_fraction: 0.0   # 0.0 = drop any row with a NaN/Inf feature

  # Skewness (on TRAIN split only) above which a non-negative column
  # gets log1p-transformed.
  log1p_skew_threshold: 1.0

  cicids2017:
    raw_dir: "data/raw/cicids2017/TrafficLabelling/TrafficLabelling"
    processed_dir: "data/processed/cicids2017"
    # official UNB CIC-IDS-2017 weekday file -> day label mapping
    files:
      "Monday-WorkingHours.pcap_ISCX.csv": "Monday"
      "Tuesday-WorkingHours.pcap_ISCX.csv": "Tuesday"
      "Wednesday-workingHours.pcap_ISCX.csv": "Wednesday"
      "Thursday-WorkingHours-Morning-WebAttacks.pcap_ISCX.csv": "Thursday"
      "Thursday-WorkingHours-Afternoon-Infilteration.pcap_ISCX.csv": "Thursday"
      "Friday-WorkingHours-Morning.pcap_ISCX.csv": "Friday"
      "Friday-WorkingHours-Afternoon-PortScan.pcap_ISCX.csv": "Friday"
      "Friday-WorkingHours-Afternoon-DDos.pcap_ISCX.csv": "Friday"
    zero_day_holdout_labels: ["Infiltration", "Web Attack-Brute Force"]
    rare_labels: ["Heartbleed", "Infiltration", "Web Attack-SQL Injection", "Bot"]
    # Phase 3 groups rows into sequences per these columns, sorted by the
    # time column. NOTE (Phase 3 Part A finding): these are the base
    # entity-grouping columns only -- the sequence builder additionally
    # groups by temporal_split and the active client_id_alpha{X} column
    # (client assignment is row-level Dirichlet, not host-level, so a
    # single host's rows can span many different clients; grouping by
    # host alone would build sequences that cross client and train/val/
    # test boundaries). See sequences.py.
    sequence_group_columns: ["Source IP"]
    sequence_time_column: "Timestamp"

  nbaiot:
    raw_dir: "data/raw/nbaiot/extracted"
    # Explicit device list (not a directory glob) so an unexpected extra
    # folder never silently becomes a 10th device.
    devices:
      - "Danmini_Doorbell"
      - "Ecobee_Thermostat"
      - "Ennio_Doorbell"
      - "Philips_B120N10_Baby_Monitor"
      - "Provision_PT_737E_Security_Camera"
      - "Provision_PT_838_Security_Camera"
      - "Samsung_SNH_1011_N_Webcam"
      - "SimpleHome_XCS7_1002_WHT_Security_Camera"
      - "SimpleHome_XCS7_1003_WHT_Security_Camera"
    processed_dir: "data/processed/nbaiot"
    zero_day_holdout_labels: ["Mirai-Udpplain"]
    # N-BaIoT has no real timestamp -- row order within a (device, Label,
    # shard) group already IS chronological order (see nbaiot.py). This
    # is the grouping for the 45-CLIENT scheme (client_id_45 is already
    # a deterministic function of device+shard_id, so this also
    # respects client boundaries with no extra column needed). The
    # 9-CLIENT ablation drops shard_id from this list -- see sequences.py
    # / scripts/build_sequences_nbaiot.py -- since a "client" there is
    # the whole device and shard boundaries don't apply.
    sequence_group_columns: ["device", "Label", "shard_id"]
    sequence_time_column: "row_order"
    # N-BaIoT has no pre-defined "rare" classes like CICIDS2017's
    # Heartbleed -- these are the two smallest non-zero-day classes by
    # actual sequence count in the real main_45 build (50,839 and
    # 52,163 out of ~1.3M non-holdout sequences; nowhere near as
    # extreme as CICIDS2017's rarity, but the smallest present).
    rare_labels: ["BASHLITE-Scan", "BASHLITE-Junk"]

# ------------------------------------------------------------
# Sequence construction (Phase 3)
# ------------------------------------------------------------
sequence:
  window_size: 10
  stride: 5

# ------------------------------------------------------------
# Model architecture (Phase 4) — FROZEN, do not change without approval
# ------------------------------------------------------------
model:
  encoder:
    layer1_units: 64      # LSTM(F -> 64)
    layer2_units: 32      # LSTM(64 -> 32)
  latent_dim: 32
  decoder:
    layer1_units: 64      # LSTM(32 -> 64)
    # final LSTM layer output size = F, set at runtime from data
  classifier_head:
    hidden_units: 32       # Linear(32 -> 32)
    dropout: 0.2
    # output size = C_k, set per client at runtime
  loss:
    lambda_ce: 1.0          # total_loss = MSE_recon + lambda * CE
  optimizer:
    name: "adam"
    learning_rate: 0.001
  batch_size: 64

# ------------------------------------------------------------
# Phase 4: centralized/local baseline training
# ------------------------------------------------------------
training:
  epochs: 10
  num_workers: 0        # Windows: start at 0, see Phase 4 writeup
  # pin_memory is NOT set here -- train_baseline.py derives it from the
  # actually-selected device (True only if CUDA), never a static flag.
  checkpoint_dir: "experiments/checkpoints"
  results_dir: "experiments/results"
  # A local client's model is only trained if it clears both bars --
  # otherwise it's skipped with an explicit log entry, never trained on
  # a degenerate single-class set, never given fabricated samples.
  local_training:
    min_train_sequences: 10
    min_train_classes: 2

# ------------------------------------------------------------
# Federated learning (Phase 5+)
# ------------------------------------------------------------
federated:
  algorithm: "fedavg"
  aggregation: "weighted_by_dataset_size"
  num_rounds: 100
  local_epochs: 2
  client_participation_fraction: 0.2

  cicids2017:
    num_clients: 40
    clients_per_round: 8         # 20% of 40
    dirichlet_alpha_values: [5, 0.5, 0.1]

  nbaiot:
    num_devices: 9
    shards_per_device: 5
    num_clients: 45              # 9 devices x 5 shards
    ablation_num_clients: 9      # realistic 9-client comparison

# ------------------------------------------------------------
# Latent class prototypes (Phase 7)
# ------------------------------------------------------------
prototypes:
  clip_bound: 1.0                       # B
  zero_day_threshold_multiplier: 0.5    # tau = weighted mean pairwise dist * 0.5
  # threshold is calibrated on validation data at runtime, then frozen for eval

# ------------------------------------------------------------
# Differential privacy (Phase 8) — client-level DP only
# ------------------------------------------------------------
privacy:
  mechanism: "client_level_dp"          # NOT per-example DP-SGD
  clipping: "adaptive_median"           # C_t = median of client update norms
  noise_mechanism: "gaussian"
  accountant: "rdp"                     # via Opacus RDPAccountant
  delta: 1.0e-5                         # must be explicit, see README Phase 8 notes
  epsilon_values: [.inf, 8, 3, 1, 0.5]  # privacy-utility sweep (E3)

# ------------------------------------------------------------
# Secure aggregation (Phase 9)
# ------------------------------------------------------------
secure_aggregation:
  framework: "flower_secagg_plus"

# ------------------------------------------------------------
# Concept drift detection (Phase 10) — unsupervised only
# ------------------------------------------------------------
drift:
  primary_detector: "adwin"
  adwin_delta: 0.002
  backup_detector: "psi"
  psi_threshold: 0.25
  psi_reference_window_size: 5000       # last N benign windows
  retrain_trigger_consecutive_rounds: 2 # mean drift > threshold for N rounds
  # Not in the frozen spec -- chosen from real testing: PSI (10 bins) is
  # statistically unstable below ~200 samples/round (spuriously exceeds
  # 0.25 on pure noise), stable well below threshold at >=200. See
  # src/fedpda_ids/drift/detectors.py's module docstring.
  round_window_size: 500

# ------------------------------------------------------------
# Logging
# ------------------------------------------------------------
logging:
  level: "INFO"
  log_to_file: true
  log_dir: "logs"
