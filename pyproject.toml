[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fedpda-ids"
version = "0.1.0"
description = "Privacy-Preserving Drift-Adaptive Federated Learning Framework for IoT Intrusion Detection"
requires-python = ">=3.10,<3.12"

[tool.setuptools.packages.find]
where = ["src"]

# The FastAPI presentation layer lives at the repo root (api/) rather than
# under src/, because it is an application on top of the research library
# rather than part of it. Declaring both roots keeps editors and type
# checkers able to resolve `api.*` as well as `fedpda_ids.*`.
[tool.pyright]
extraPaths = ["src", "."]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
